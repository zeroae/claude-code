name: Publish Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Match version tags like v2.1.17
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Claude Code version to build (e.g., 2.1.23)'
        required: false
        type: string
      update_aliases:
        description: 'Also update alias tags (latest, vX, vX.Y). Disable to only push the exact version tag.'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: 'Claude Code version to build (e.g., 2.1.23)'
        required: true
        type: string
      update_aliases:
        description: 'Also update alias tags (latest, vX, vX.Y). Disable to only push the exact version tag.'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-source:
    name: Verify Claude Code Source URL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GCS bucket URL
        run: |
          chmod +x .claude/skills/verifying-claude-source/scripts/verify-source.sh
          .claude/skills/verifying-claude-source/scripts/verify-source.sh

  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: verify-source
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=ref,event=pr,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},enable=${{ inputs.version == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.version == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.version == '' }}
            type=raw,value=latest,enable=${{ inputs.version == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            # Tags for version input (workflow_dispatch / workflow_call)
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' && inputs.update_aliases }}
            type=semver,pattern={{major}},value=v${{ inputs.version }},enable=${{ inputs.version != '' && inputs.update_aliases }}
            type=raw,value=latest,enable=${{ inputs.version != '' && inputs.update_aliases }}
          labels: |
            org.opencontainers.image.title=Claude Code Container
            org.opencontainers.image.description=Containerized Claude Code CLI with VSIX extension

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDE_VERSION=${{ inputs.version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify VSIX in built image
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        run: |
          # Extract first tag from metadata
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)

          echo "Verifying VSIX in image: ${IMAGE_TAG}"

          # Verify VSIX exists
          docker run --rm --entrypoint ls "${IMAGE_TAG}" -lh /opt/claude-code/claude-code.vsix

          # Verify VSIX is valid
          docker run --rm --entrypoint file "${IMAGE_TAG}" /opt/claude-code/claude-code.vsix

          echo "VSIX verification successful"

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
