name: Publish Containers

on:
  push:
    branches: [main]
    tags: ['v*', 'codex-v*', 't3-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Image to publish
        type: choice
        options: [all, claude, codex, t3]
        default: all
      version:
        description: Optional upstream version; requires one explicit target
        type: string
      update_aliases:
        description: Update latest, major, and minor aliases
        type: boolean
        default: true
      no_cache:
        description: Ignore build cache
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        type: string
        default: claude
      version:
        type: string
        default: ''
      update_aliases:
        type: boolean
        default: true
      no_cache:
        type: boolean
        default: false

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select independently versioned images
        id: select
        env:
          IMAGE_TARGET: ${{ inputs.target || 'all' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 scripts/image_release.py select --target "$IMAGE_TARGET" --version "$REQUESTED_VERSION" --ref "$GITHUB_REF"

  publish:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/publish-image.yml
    with:
      target: ${{ matrix.target }}
      version: ${{ needs.select.outputs.version }}
      update_aliases: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.update_aliases }}
      no_cache: ${{ inputs.no_cache || false }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
